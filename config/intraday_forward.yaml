# Forward experimental de forex (Etapa 3).
#
# Solo dos candidatos, parámetros congelados y cuenta demo. No es una
# validación: los dos tienen Sharpe negativo en backtest y no pasaron la
# puerta de incubación. Se usan como excepción forward documentada.
#
# enabled:true = forward demo automático en la próxima ventana de sesión.
# La tarea programada usa `--execute --confirm FORWARD-DEMO`; volumen mínimo,
# máximo 1 trade/día por bot y cierre obligatorio por sesión.
version: 1
account: ftmo_demo
# Defensa de equity (HWM + zonas + circuit breaker diario):
#   off     -> no evalúa
#   report  -> evalúa y lo publica en guards, sin bloquear (dry-run)
#   enforce -> bloquea aperturas en zona caution o con el breaker disparado
defense: report
bots:
  - id: eurusd-london-pullback-forward
    canonical_symbol: EURUSD
    strategy: london_pullback
    timeframe: M15
    account: ftmo_demo
    params:
      fast: 50
      slow: 100
      pullback_atr: 0.5
      max_hold: 16
    entry_start: "07:00"
    entry_end: "16:00"
    force_exit: "16:00"
    stop_atr: 2.0
    max_trades_per_day: 1
    magic: 20261151
    enabled: true
    notes: "Forward experimental; backtest Sharpe -4.42, MaxDD -30.4%."

  - id: usdjpy-tokyo-breakout-forward
    canonical_symbol: USDJPY
    strategy: tokyo_breakout
    timeframe: M15
    account: ftmo_demo
    params:
      range_bars: 8
      buffer_atr: 0.25
      max_hold: 4
    entry_start: "00:00"
    entry_end: "03:00"
    force_exit: "04:00"
    stop_atr: 2.0
    max_trades_per_day: 1
    magic: 20261152
    enabled: true
    notes: "Forward experimental; backtest Sharpe -4.63, MaxDD -8.1%."

  # Swing CFD demo. La señal es diaria (trend_daily_atr: 50/200 + régimen 200)
  # y la ejecución es la primera barra H4 del día UTC (00:00-04:00), evaluada
  # al cierre de esa barra (04:00 UTC). No hay force_exit: la posición puede
  # dormir varios días. FTMO Swing permite mantener overnight y fin de semana;
  # esta demo no impone restricción de overnight, así que solo la cierran la
  # señal contraria o el stop. `exposure` se aplica sobre el volumen mínimo:
  # si 0,75 × mínimo cae por debajo del mínimo del bróker, se usa el mínimo
  # (el tamaño efectivo es el 100 % del mínimo, documentado aquí).
  - id: us100-trend-d1
    canonical_symbol: US100.cash
    strategy: trend_daily_atr
    timeframe: H4
    account: ftmo_demo
    params:
      fast: 50
      slow: 200
      regime: 200
      stop_atr: 3.0
      atr_window: 14
    exposure: 0.75
    entry_start: "00:00"
    entry_end: "04:00"
    force_exit: null
    stop_atr: 3.0
    max_trades_per_day: 1
    magic: 20261153
    enabled: false
    notes: "Swing demo US100 (k=0,75 sobre el volumen mínimo). Sin force_exit; cierra por señal contraria o stop. FTMO Swing permite overnight."
