    template: false
    protected: true
    allowed_instruments: [US100]
    limits: {daily_loss: 5000, max_loss: 10000, drawdown_mode: static, profit_target: 10000, max_lots: 20}
    notes: "Espejo de ftmo_trial_ea (blocked en el carril FTMO hasta un nuevo Free Trial)."

