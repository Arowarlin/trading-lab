# Prop Fund · cuentas de fondeo (una entrada por cuenta, nunca por firma).
#
# * No hay cuentas de capital propio: paper_main / alpaca_paper se retiraron
#   con el carril de acciones/ETF (archivadas en legacy/).
# * template: true  → ejemplo de estructura, NO una cuenta real ni disponibilidad
#   confirmada. Las plantillas nunca reciben órdenes.
# * connection_state arranca en DISCONNECTED. Solo PAPER/DEMO pueden enrutar.
#   LIVE_* exige autorización humana explícita fuera de este archivo.
# * credentials_ref es el nombre en Windows Credential Manager (keyring), nunca
#   el secreto.
# * Una cuenta nunca hereda condiciones de otra: cada una declara sus límites.
version: 1

accounts:
  # --- FTMO (carril existente, protegido): espejo de solo lectura ----------
  - id: CFD-001
    firm: ftmo
    program: ftmo_2step
    market: cfd
    phase: evaluation
    nominal_size: 100000
    platform: mt5
    execution_provider: mt5
    connection_state: DEMO
    legacy_account: ftmo_demo
    template: false
    protected: true
    allowed_instruments: [US100, XAUUSD, EURUSD, GBPUSD, USDJPY]
    limits: {daily_loss: 5000, max_loss: 10000, drawdown_mode: static, profit_target: 10000, max_lots: 20}
    risk: {per_trade_risk_pct: 0.005, daily_risk_pct: 0.04, max_trades_per_day: 4, max_open_positions: 5, buffer_vs_firm_pct: 0.10, max_cost_r: 0.20}
    automation_acknowledged: true
    credentials_ref: tradinglab/mt5/ftmo_demo
    notes: >
      Espejo de ftmo_demo. EA us100-ftmo1, ai_trader y forward FX operan con su
      propio motor; el router del Prop Fund NO envía órdenes a esta cuenta para
      esas estrategias, solo las ve en el riesgo global.

  - id: CFD-002
    firm: ftmo
    program: ftmo_2step
