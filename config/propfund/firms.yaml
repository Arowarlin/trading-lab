# Prop Fund · registro de empresas de fondeo (CFD y Futures).
#
# ⚠️  Este archivo NO entra en el hash de F13 y NO modifica la firma activa del
# carril FTMO (config/prop.yaml). Es la capa nueva multiempresa.
#
# Reglas del archivo:
#   * Ningún dato inventado. Si no se encontró en la fuente: value: null y
#     status: needs_verification (la consola lo muestra como "Sin datos").
#   * Toda política lleva fuente (url + consulted_at). Las fuentes secundarias
#     se marcan kind: secondary y NO cuentan como verificadas.
#   * La automatización solo se permite si permission es full/conditional, el
#     status es verified_official y el operador marcó automation_acknowledged
#     en la cuenta. "API disponible" no significa "API autorizada".
#   * rules_version cambia cada vez que se edita una regla: el comando
#     `lab propfund affected --firm X` lista las cuentas afectadas.
#
# Investigación: 2026-11-19 (help centers oficiales y comparativas 2026).
version: 1

firms:
  # ------------------------------------------------------------------ CFD
  - id: ftmo
    name: FTMO
    market: cfd
    priority: 1
    enabled: true
    protected: true
    legacy_prop_key: ftmo
    website: https://ftmo.com
    platforms: [mt4, mt5, ctrader, dxtrade]
    execution_providers: [mt5]
    rules_version: "2026-11-19.1"
    notes: >
      Implementación existente (EA us100-ftmo1, ai_trader, forward FX). Las reglas
      numéricas viven en config/prop.yaml (hash F13) y no se duplican aquí.
    automation:
      permission: conditional
      status: verified_official
      conditions:
        - "EAs permitidos sin aprobación previa (MT4/MT5/cTrader)."
        - "Prohibida la hiperactividad: más de 2.000 peticiones al servidor por día."
        - "Un EA de terceros compartido puede chocar con el límite de asignación de capital."
        - "El estilo debe ser replicable en una cuenta real."
      allowed_phases: [evaluation, verification, funded]
      copy_trading: unknown
      sources:
        - {url: "https://ftmo.com/?p=678488", consulted_at: 2026-11-19, kind: official}
        - {url: "https://ftmo.oanda.com/forbidden-trading-practices/", consulted_at: 2026-11-19, kind: official}
    programs:
      - id: ftmo_2step
        name: FTMO Challenge 2-Step
        phases: [evaluation, verification, funded]
        platforms: [mt5]
        sizes: [10000, 25000, 50000, 100000, 200000]
        rules:
          - {key: profit_target_pct, value: 0.10, unit: fraction, phase: evaluation, status: verified_secondary, source: {url: "https://app.luxalgo.com/api/propfirms/list", consulted_at: 2026-11-05, kind: secondary}, notes: "Referencia de config/prop.yaml"}
          - {key: profit_target_pct, value: 0.05, unit: fraction, phase: verification, status: verified_secondary, source: {url: "https://app.luxalgo.com/api/propfirms/list", consulted_at: 2026-11-05, kind: secondary}}
          - {key: max_daily_loss_pct, value: 0.05, unit: fraction, status: verified_secondary, source: {url: "https://app.luxalgo.com/api/propfirms/list", consulted_at: 2026-11-05, kind: secondary}}
          - {key: max_loss_pct, value: 0.10, unit: fraction, status: verified_secondary, source: {url: "https://app.luxalgo.com/api/propfirms/list", consulted_at: 2026-11-05, kind: secondary}}
          - {key: drawdown_mode, value: static, status: verified_secondary, source: {url: "https://app.luxalgo.com/api/propfirms/list", consulted_at: 2026-11-05, kind: secondary}}
          - {key: reset_tz, value: Europe/Prague, status: verified_secondary}
          - {key: max_server_requests_per_day, value: 2000, unit: requests, status: verified_official, source: {url: "https://ftmo.oanda.com/forbidden-trading-practices/", consulted_at: 2026-11-19}}

