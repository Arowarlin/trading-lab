        - {url: "https://fxempire.com/prop-firms/the5ers", consulted_at: 2026-11-19, kind: secondary}
    programs:
      - {id: the5ers_hyper_growth, name: Hyper Growth, phases: [evaluation, funded], platforms: [mt5]}
