  - id: usdjpy-tokyo-breakout-forward
    name: USDJPY Tokyo Breakout (forward FTMO)
    lane: protected_ftmo
    market: cfd
    instruments: [USDJPY]
    timeframe: M15
    status: forward
    protected: true
    params_ref: config/intraday_forward.yaml
    notes: "Estrategia existente 2 de 2 del carril FTMO. Parámetros congelados."

  - id: us100-trend-d1
    name: US100 Trend D1 (incubación)
    lane: protected_ftmo
    market: cfd
    instruments: [US100]
    timeframe: H4
    status: forward
    protected: true
    params_ref: config/intraday_forward.yaml
    notes: "Incubación swing en el mismo archivo protegido."

