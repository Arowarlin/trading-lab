# Prop Fund · catálogo de estrategias por carril.
#
# Los parámetros NO se duplican: params_ref apunta al archivo dueño.
# protected: true → el Prop Fund solo las observa (riesgo global, consola);
# nunca las optimiza, renombra, migra ni les envía órdenes.
version: 1

strategies:
  # --- Carril FTMO protegido -----------------------------------------------
  - id: ea:us100-ftmo1
    name: EA US100 FTMO1 (us100_ftmo_confluence)
    lane: protected_ftmo
    market: cfd
    instruments: [US100]
    timeframe: M5
    status: forward
    protected: true
    engine: mt5_ea
    params_ref: integrations/mt5/us100_ftmo1/US100_FTMO_v3_challenge.set
    notes: "Magics 93010001/93020001. El laboratorio lo mide, no lo ejecuta."

  - id: ai_trader
    name: Carril IA discrecional (scalping · intradía · swing)
    lane: protected_ftmo
    market: cfd
    instruments: [US100, XAUUSD, EURUSD, GBPUSD, USDJPY]
    timeframe: M1-D1
    status: demo
    protected: true
    engine: ai_trader
    params_ref: config/ai_trader.yaml
    notes: "Magics 20261191-20261193. Solo ftmo_demo."

  - id: eurusd-london-pullback-forward
