# Bots intradía (Etapa 2). Todos enabled:false; el orquestador los carga además
# de config/bots.yaml. Un activo puede tener varias familias; los parámetros
# no se comparten entre activos (cada bot declara su propia rejilla acotada).
# Los símbolos vienen del broker (tabla asset_aliases), no se suponen.
bots:
  # Nasdaq (índice)
  - id: nasdaq-orb-ny
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: orb_ny
    family: orb_ny
    universe: [US100.cash]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "NY"}
    grid: {range_bars: [4, 8], buffer_atr: [0.1, 0.25], max_hold: [8, 16]}
    description: "Ruptura del rango de apertura de Nueva York sobre US100.cash."
  - id: nasdaq-trend-intraday
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: trend_intraday
    family: trend_intraday
    universe: [US100.cash]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "NY"}
    grid: {fast: [20, 50], slow: [100, 200], pullback_atr: [0.25, 0.5], max_hold: [8, 16]}
    description: "Tendencia intradía de Nueva York sobre US100.cash."
  - id: nasdaq-caja-ny
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: caja_ny
    family: caja_ny
    universe: [US100.cash]
    timeframe: M5
    enabled: false
    exposure: 0.25
    params: {session: "NY", execution: "events"}
    grid: {range_start: ["09:15"], range_end: ["09:35"], stop_rule: ["range", "atr_0.5", "atr_1.0", "atr_1.5"], force_exit: ["15:45"], max_trades_per_day: [1]}
    description: "Caja de apertura NY con ruptura y retroceso limitado; investigación por eventos, disabled."
  # Oro
  - id: gold-asian-rev
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: asian_rev
    family: asian_rev
    universe: [XAUUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {}
    grid: {buffer_atr: [0.1, 0.3], max_hold: [8, 16]}
    description: "Reversión del rango asiático sobre XAUUSD."
  - id: gold-overlap-breakout
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: overlap_breakout
    family: overlap_breakout
    universe: [XAUUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "LondonNY"}
    grid: {range_bars: [4, 8], buffer_atr: [0.1, 0.25], max_hold: [4, 8]}
    description: "Ruptura en el solape Londres/NY sobre XAUUSD."
  # EURUSD
  - id: eurusd-range-reversal
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: range_reversal
    family: range_reversal
    universe: [EURUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "London"}
    grid: {lookback: [12, 24], entry_z: [1.5, 2.0], max_hold: [8, 16]}
    description: "Reversión en rango durante Londres sobre EURUSD."
  - id: eurusd-london-pullback
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: london_pullback
    family: london_pullback
    universe: [EURUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "London"}
    grid: {fast: [20, 50], slow: [100, 200], pullback_atr: [0.25, 0.75], max_hold: [8, 16]}
    description: "Tendencia con retroceso en Londres sobre EURUSD."
  # USDJPY
  - id: usdjpy-session-trend
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: session_trend
    family: session_trend
    universe: [USDJPY]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "TokyoLondon"}
    grid: {fast: [20, 50], slow: [100, 200], pullback_atr: [0.25, 0.5], max_hold: [8, 24]}
    description: "Tendencia con filtro de sesión sobre USDJPY."
  - id: usdjpy-tokyo-breakout
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: tokyo_breakout
    family: tokyo_breakout
    universe: [USDJPY]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "Tokyo"}
    grid: {range_bars: [4, 8], buffer_atr: [0.1, 0.25], max_hold: [4, 12]}
    description: "Ruptura tras la sesión de Tokio sobre USDJPY."

  # --- Familias de sesión (Etapa 3h): todas enabled:false ---
  - id: eurusd-session-hold
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: session_hold
    family: session_hold
    universe: [EURUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "LDN", direction: 1}
    grid: {atr_k: [1.0, 1.5, 2.0]}
    description: "Entrada en la apertura de Londres y salida al cierre de la sesión."
  - id: usdjpy-session-hold-ny
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: session_hold
    family: session_hold
    universe: [USDJPY]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {session: "NY", direction: 1}
    grid: {atr_k: [1.0, 1.5, 2.0]}
    description: "Entrada en la apertura de Nueva York y salida al cierre de la sesión."
  - id: eurusd-fix-flow
    type: deterministic
    profile: intraday_fx
    cluster: intraday_fx
    account: ftmo_demo
    strategy: fix_flow
    family: fix_flow
    universe: [EURUSD]
    timeframe: M15
    enabled: false
    exposure: 0.25
    params: {window_min: 60, side: "short_usd"}
    grid: {window_min: [30, 60, 90]}
    description: "Flujo del fix del BCE: corto EURUSD en la ventana previa al fix."

  # --- Tendencia diaria en CFDs de tick grande (Etapa 3m): todos enabled:false ---
  - id: us100-trend-d1
    type: deterministic
    profile: swing_cfd
    cluster: swing_cfd
    account: ftmo_demo
    strategy: trend_daily_atr
    family: trend
    universe: [US100.cash]
    timeframe: H4
    enabled: false
    # Exposición decidida con `lab prop exposure-sweep` (2026-11-11):
    # k=0,75 da EV +233 EUR/intento con breach 36,0 % y peor 5 % MaxDD -26,6 %;
    # k=1 da algo más de EV (+338) pero 45,4 % de breach y -34,1 % de cola.
    exposure: 0.75
    params: {fast: 20, slow: 100, regime: 200, stop_atr: 2.0, atr_window: 14}
    grid: {fast: [20, 50], slow: [100, 200], stop_atr: [2.0, 3.0]}
    description: "Tendencia diaria sobre US100.cash (senal D1, ejecucion H4, stop ATR)."
  - id: xauusd-trend-d1
    type: deterministic
    profile: swing_cfd
    cluster: swing_cfd
    account: ftmo_demo
    strategy: trend_daily_atr
    family: trend
    universe: [XAUUSD]
    timeframe: H4
    enabled: false
    exposure: 0.25
    params: {fast: 20, slow: 200, regime: 200, stop_atr: 2.0, atr_window: 14}
    grid: {fast: [20, 50], slow: [100, 200], stop_atr: [2.0, 3.0]}
    description: "Tendencia diaria sobre XAUUSD (senal D1, ejecucion H4, stop ATR)."
