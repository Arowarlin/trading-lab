# Configuración que sí consume qqq-trend-f13.
#
# El resto de la configuración operativa (LLM, MT5, daytrader, backup, etc.)
# vive en config/ops.yaml y no entra en el hash de F13. Lista exacta y motivo
# en docs/f13.md.
mode: paper                 # paper | live  (live exige confirmación explícita)

risk:
  max_position_pct: 0.10      # máximo 10% del equity por ticker
  max_gross_exposure: 0.90    # máximo 90% invertido
  max_positions: 8
  daily_loss_limit_pct: 0.03  # kill switch diario
  max_drawdown_pct: 0.15      # kill switch global
  per_trade_risk_pct: 0.01    # 1% del equity arriesgado por operación
  atr_stop_mult: 2.0

data:
  provider: yahoo             # yahoo | alpaca
  cache_dir: data/cache

execution:
  broker: paper               # paper | alpaca
  commission_bps: 1.0
  slippage_bps: 5.0
