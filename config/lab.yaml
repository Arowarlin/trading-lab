# Configuración base del laboratorio (paper/demo).
# El detalle operativo (LLM, MT5, ProjectX, operador, backup, etc.) vive en
# config/ops.yaml. El Prop Fund y sus cuentas viven en config/propfund/.

mode: paper                 # paper | live  (live exige confirmación explícita)

risk:
  max_position_pct: 0.10      # máximo 10% del equity por activo
  max_gross_exposure: 0.90    # máximo 90% invertido
  max_positions: 8
  daily_loss_limit_pct: 0.03  # kill switch diario
  max_drawdown_pct: 0.15      # kill switch global
  per_trade_risk_pct: 0.01    # 1% del equity arriesgado por operación
  atr_stop_mult: 2.0

data:
  provider: yahoo             # caché de datos; la consola CFD lee MT5 en solo lectura
  cache_dir: data/cache

execution:
  broker: paper               # paper interno; MT5/ProjectX van por sus adaptadores
  commission_bps: 1.0
  slippage_bps: 5.0
