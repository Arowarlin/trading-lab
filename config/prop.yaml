# Reglas de cuentas de fondeo.
#
# ⚠️  ESTO ES UNA PLANTILLA, NO UNA FUENTE DE VERDAD.
# Las reglas cambian por firma, por programa y por contrato. Antes de operar
# una cuenta real, verifica cada valor en tu contrato y ajusta este archivo.
#
# buffer_pct: fracción del límite que el bot NO usa (colchón de seguridad).
# max_loss_mode:
#   static            -> el suelo se calcula sobre el balance inicial (no sube)
#   trailing_eod      -> el suelo sigue el cierre diario más alto
#   trailing_intraday -> el suelo sigue el máximo de equity intradía
# daily_loss_mode: balance | equity  (equity incluye flotante)
#
# Filtros de sesión y noticias (verifica cada uno en el contrato de tu firma):
#   weekend_holding      true = permite mantener el fin de semana; false = exige
#                        aplanar antes del corte del viernes y bloquea aperturas.
#   news_blackout_min    minutos antes/después de un evento macro de alto impacto
#                        en macro_events. 0 = desactivado.
#   friday_cutoff_hour   hora local de reset_tz (FTMO: Europe/Prague) del corte
#                        del viernes. null = usar friday_close_utc.
#   rollover_utc         cierre diario del servidor en UTC (futuros/CFD).
#   rollover_blackout_min minutos de bloqueo alrededor del rollover. 0 = off.
#
# Contraste 2026-11-05 con el directorio público de LuxAlgo
# (https://app.luxalgo.com/api/propfirms/list, challenge
# "ftmo-normal-challenge-2-steps-100k"):
#   objetivo 10% / 5% · diario 5% · máximo 10% STATIC · 4 días mínimos
#   noticias permitidas · mantener fin de semana permitido
#   apalancamiento 100 (Normal) / 30 (Swing)
# La fuente no publica `lastVerifiedAt`, así que esto sigue siendo plantilla
# hasta confirmarlo en EL CONTRATO de tu cuenta.

firms:
  ftmo:
    display_name: FTMO
    program: 2-step
    verify_against_contract: true
    verified_source: "LuxAlgo prop-firm directory · ftmo-normal-challenge-2-steps-100k"
    verified_at: "2026-11-05"
    defaults:
      max_loss_mode: static
      daily_loss_mode: equity
      buffer_pct: 0.10
      reset_time: "00:00"
      reset_tz: Europe/Prague
      max_lots: 20
      max_positions: 5
      max_open_risk_pct: 0.02
      weekend_holding: true
      news_blackout_min: 0
      friday_cutoff_hour: 20
      friday_close_utc: "20:00"
      rollover_utc: "21:00"
      rollover_blackout_min: 0
      consistency_pct: null
      notes: >
        Verificar en el contrato: límite diario sobre balance o equity, hora de
        reset (CE(S)T), política de noticias, fin de semana y automatización.
        FTMO usa el MAYOR de balance/equity al cierre como base diaria; con
        daily_loss_mode=equity el guard es más estricto (nunca más laxo), así que
        el error cae del lado seguro.
    phases:
      challenge:
        profit_target_pct: 0.10
        max_daily_loss_pct: 0.05
        max_loss_pct: 0.10
        min_trading_days: 4
      verification:
        profit_target_pct: 0.05
        max_daily_loss_pct: 0.05
        max_loss_pct: 0.10
        min_trading_days: 4
      funded:
        profit_target_pct: 0.0
        max_daily_loss_pct: 0.05
        max_loss_pct: 0.10
        min_trading_days: 0

  # --- PLANTILLA Topstep 50K: INACTIVA. No cambia la firma activa (FTMO). ---
  # Verifica CADA valor en el contrato vigente de Topstep antes de usarla.
  # Para activarla: cambia config/lab.yaml -> prop.firm: topstep y revisa fase.
  topstep:
    display_name: Topstep
    program: trading-combine
    enabled: false          # plantilla: no se usa mientras FTMO sea la firma activa
    template: true
    verify_against_contract: true
    defaults:
      max_loss_mode: trailing_eod
      daily_loss_mode: balance
      buffer_pct: 0.15
      reset_time: "17:00"
      reset_tz: America/Chicago
      max_lots: 5
      max_positions: 3
      max_open_risk_pct: 0.02
      weekend_holding: false
      news_blackout_min: 0
      friday_cutoff_hour: 16
      rollover_utc: "22:00"
      rollover_blackout_min: 15
      consistency_pct: 0.55
      notes: >
        PLANTILLA Topstep 50K (Trading Combine). Valores orientativos:
        objetivo 6% ($3.000), pérdida máxima 4% ($2.000) trailing EOD, límite
        diario 2% ($1.000), reset 17:00 America/Chicago y consistencia 55%.
        NO usar sin verificar el contrato vigente, el modo exacto de trailing,
        la política de noticias, el fin de semana y la automatización.
    phases:
      challenge:
        profit_target_pct: 0.06
        max_daily_loss_pct: 0.02
        max_loss_pct: 0.04
        min_trading_days: 5
      funded:
        profit_target_pct: 0.0
        max_daily_loss_pct: 0.02
        max_loss_pct: 0.04
        min_trading_days: 0
