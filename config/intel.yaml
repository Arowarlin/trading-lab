# Fuentes de información continua (solo lectura).
# Finnhub usa FINNHUB_API_KEY desde keyring/.env; nunca se escribe aquí.
scoring:
  # ID exacto cargado en LM Studio; no cambia el modelo por defecto del lab.
  # Alineado al MoE que el lab carga por defecto (30B-A3B, CPU): el 27B denso
  # tarda ~1340 s por llamada y no está cargado.
  model: "qwen/qwen3-30b-a3b"
  limit: 20
  batch_size: 8
feeds:
  yahoo-spy:
    url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=SPY&region=US&lang=en-US"
    enabled: true
  yahoo-qqq:
    url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=QQQ&region=US&lang=en-US"
    enabled: true
