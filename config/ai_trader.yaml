# Carril IA discrecional (solo demo).
#
# Tres estilos con riesgo, magic y ventana propios. El LLM elige estilo,
# estrategia, símbolo, timeframe y dirección; los niveles y el lote los calcula
# el código. Nunca live: la cuenta debe ser ftmo_demo.
#
# El reset diario es el de FTMO en config/prop.yaml (Europe/Prague). Al tocar
# el stop de un estilo, ese estilo no abre más ese día; al tocar el global,
# ninguno de los tres abre.
version: 2
account: ftmo_demo
enabled: true

global:
  account: ftmo_demo
  daily_stop: 0.03            # 3% del equity: stop global del carril
  max_open_total: 5
  max_open_per_symbol_per_style: 1
  universe: [US100.cash, XAUUSD, EURUSD, GBPUSD, USDJPY]
  playbook_version: 1
  # Slippage en precio por símbolo (no en puntos). El coste/R usa 2×.
  slippage_price:
    US100.cash: 1.0
    XAUUSD: 0.15
    EURUSD: 0.00005
    GBPUSD: 0.00005
    USDJPY: 0.005

styles:
  scalping:
    enabled: true
    magic: 20261191
    timeframes: [M1, M5]
    risk_per_trade: 0.0025    # 0,25% del equity por operación
    daily_stop: 0.01          # 1%
    max_trades_per_day: 15
    max_cost_r: 0.15
    max_open: 2
    universe: [US100.cash, XAUUSD]
    session:
      start: "09:30"
      end: "12:00"
      tz: America/New_York
    # Playbook v1: cuatro estrategias M1/M5 solo para US100 y XAUUSD.
    # Sin asignación fuera de esta lista, propose rechaza.
    allowed:
      US100.CASH:
        ema_ribbon_pullback: M1
        vwap_bounce: M5
        orb_5m: M5
        momentum_burst: M1
      XAUUSD:
        ema_ribbon_pullback: M1
        vwap_bounce: M5
        orb_5m: M5
        momentum_burst: M1

  intraday:
    enabled: true
    magic: 20261192
    timeframes: [M15, H1]
    risk_per_trade: 0.005     # 0,5% del equity por operación
    daily_stop: 0.01          # 1%
    max_trades_per_day: 3
    max_cost_r: 0.10
    max_open: 2
    # Sin `universe` propio: usa el global.
    allowed:
      US100.CASH:
        orb_ny: M15
        vwap_reversion: M15
        bollinger_squeeze: H1
      XAUUSD:
        liquidity_sweep: H1
      EURUSD:
        london_breakout: H1
        ema_pullback: H1
      GBPUSD:
        london_breakout: H1
        ema_pullback: H1
      USDJPY:
        ema_pullback: H1

  swing:
    enabled: true
    magic: 20261193
    timeframes: [H4, D1]
    risk_per_trade: 0.01      # 1% del equity por operación
    daily_stop: 0.01          # 1%
    max_open_risk: 0.02       # 2% de riesgo abierto acumulado del estilo
    max_trades_per_day: 2
    max_cost_r: 0.05
    max_open: 2
    # Sin `universe` propio: usa el global.
    allowed:
      US100.CASH:
        rsi2_connors: D1
        donchian_turtle: D1
        trend_pullback: H4
      XAUUSD:
        donchian_turtle: D1
        inside_bar: D1
        trend_pullback: H4
      EURUSD:
        inside_bar: D1
        trend_pullback: H4
      GBPUSD:
        inside_bar: D1
        trend_pullback: H4
      USDJPY:
        donchian_turtle: D1
        trend_pullback: H4
