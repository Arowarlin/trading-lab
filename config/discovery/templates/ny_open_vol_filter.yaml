name: ny_open_vol_filter
symmetric: true
timeframes: [M1, M5, M15]
description: "Apertura NY: ruptura del rango de apertura con volatilidad alta."
strategy:
  dsl_version: "1"
  instrument: US100
  market: cfd
  timeframe: M5
  session:
    start: "09:35"
    end: "11:30"
    flat_at: "15:45"
    or_minutes: 15
  long_entry:
    kind: and
    args:
      - kind: gt
        left: {kind: price, price: close}
        right: {kind: level, level: opening_range_high}
      - kind: regime
        regime: vol_high
        n: 14
        lookback: 100
        params: {pct: 0.8}
  short_entry:
    kind: and
    args:
      - kind: lt
        left: {kind: price, price: close}
        right: {kind: level, level: opening_range_low}
      - kind: regime
        regime: vol_high
        n: 14
        lookback: 100
        params: {pct: 0.8}
  exit:
    stop: {type: atr, mult: 1.5, n: 14}
    target: {type: rr, rr: 2.0}
    time_exit_minutes: 240
    opposite_signal: false
  sizing:
    risk_per_trade_r: 1.0
  limits:
    max_trades_per_day: 2
    cooldown_minutes: 25
