name: asia_range_reversion
symmetric: true
description: "Reversión al rango de la sesión asiática (18:00-03:00 NY) en régimen lateral."
strategy:
  dsl_version: "1"
  instrument: US100
  market: cfd
  timeframe: M5
  session:
    start: "18:00"
    end: "03:00"
    flat_at: "02:45"
    or_minutes: 15
  long_entry:
    kind: and
    args:
      - kind: lt
        left: {kind: price, price: close}
        right: {kind: level, level: prev_session_low}
      - kind: regime
        regime: ranging
        n: 14
        params: {threshold: 20}
  short_entry:
    kind: and
    args:
      - kind: gt
        left: {kind: price, price: close}
        right: {kind: level, level: prev_session_high}
      - kind: regime
        regime: ranging
        n: 14
        params: {threshold: 20}
  exit:
    stop: {type: atr, mult: 2.0, n: 14}
    target: {type: rr, rr: 1.5}
    time_exit_bars: 36
    opposite_signal: false
  sizing:
    risk_per_trade_r: 1.0
  limits:
    max_trades_per_day: 2
    cooldown_bars: 10
