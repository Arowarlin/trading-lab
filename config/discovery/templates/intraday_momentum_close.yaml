name: intraday_momentum_close
symmetric: true
timeframes: [M5, M15, M30, H1]
description: >
  Momentum intradía de cierre en US100: el rendimiento del inicio de la sesión
  NY (09:30 → 10:00/10:30/11:00) predice el del tramo final. Entrada en la
  ventana 15:00-15:45, salida por tiempo o flat_at 15:55.
hypothesis: >
  Los rebalanceos y las órdenes al cierre de la sesión NY hacen que el impulso
  de la mañana continúe en la última hora. Se compra si el retorno de la
  mañana supera el umbral; el corto es el espejo exacto.
invalidation: >
  La hipótesis se invalida si, después de costes (spread p75 + slippage +
  comisión), la expectativa no es positiva y estable en IS y en las pruebas de
  robustez. No se lee OOS-2 para decidir esta plantilla.
parameter_space:
  threshold: [0.0, 0.001, 0.002, 0.003]
  session_return_end: ["10:00", "10:30", "11:00"]
  entry_window_start: ["15:00", "15:15", "15:30"]
grid:
  dimensions:
    - name: threshold
      kind: path
      path: long_entry.args[0].right.value
      values: [0.0, 0.001, 0.002, 0.003]
    - name: session_return_end
      kind: path
      path: long_entry.args[0].left.params.end
      values: [600, 630, 660]   # 10:00, 10:30, 11:00 NY
    - name: entry_start
      kind: path
      path: long_entry.args[1].start
      values: ["15:00", "15:15", "15:30"]
    - name: volatility
      kind: volatility
      values: ["none", "vol_high"]
    - name: exit_variant
      kind: exit
      values: ["A", "B"]
  exit_variants:
    A: {stop_mult: 3.0, target_rr: 1000.0, time_exit_minutes: 30, flat_at: "15:55"}
    B: {stop_mult: 2.0, target_rr: 2.0, time_exit_minutes: 30, flat_at: "15:55"}
strategy:
  dsl_version: "1"
  instrument: US100
  market: cfd
  timeframe: M5
  warmup_minutes: 7200
  session:
    start: "09:30"
    end: "15:55"
    flat_at: "15:55"
    or_minutes: 15
  long_entry:
    kind: and
    args:
      - kind: gt
        left:
          kind: indicator
          ind: session_return
          params: {start: 570, end: 600}
        right: {kind: const, value: 0.002}
      - kind: time_between
        start: "15:00"
        end: "15:45"
      - kind: regime
        regime: vol_high
        n: 14
        lookback: 100
        params: {pct: 0.8}
  short_entry:
    kind: and
    args:
      - kind: lt
        left:
          kind: indicator
          ind: session_return
          params: {start: 570, end: 600}
        right: {kind: const, value: -0.002}
      - kind: time_between
        start: "15:00"
        end: "15:45"
      - kind: regime
        regime: vol_high
        n: 14
        lookback: 100
        params: {pct: 0.8}
  exit:
    stop: {type: atr, mult: 2.0, n: 14}
    target: {type: rr, rr: 2.0}
    time_exit_minutes: 30
    opposite_signal: false
  sizing:
    risk_per_trade_r: 1.0
  limits:
    max_trades_per_day: 1
    cooldown_minutes: 0
