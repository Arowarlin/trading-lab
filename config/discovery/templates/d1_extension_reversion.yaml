name: d1_extension_reversion
symmetric: false
timeframes: [D1]
valid_timeframes: [D1]
description: >-
  Reversión a la media en D1 tras una extensión bajista, con filtro de tendencia
  larga y RSI(2) bajo. Long-only: el sesgo largo es parte de la hipótesis.
hypothesis: >-
  Tras varias desviaciones estándar por debajo de su media, un activo que sigue
  en tendencia larga tiende a rebotar porque el movimiento responde a liquidez y
  sobrerreacción, no a un cambio de régimen. Comprar la extensión en la
  dirección de la tendencia larga evita pelear contra el mercado. Referencias:
  Connors/Alvarez (RSI-2, 2008); Jegadeesh (JF 1990); De Bondt/Thaler (JF 1985).
invalidation: >-
  Se invalida si el rebote no supera el coste de forma estable en IS y robustez,
  o si el filtro SMA(200) deja la muestra por debajo del mínimo. No se lee OOS-2.
parameter_space:
  z_n: [10, 20, 30]
  z_entry: [-1.5, -2.0, -2.5]
  stop_mult: [1.5, 2.0, 2.5]
grid:
  dimensions:
    - name: z_n
      kind: path
      path: long_entry.args[0].left.n
      values: [10, 20, 30]
    - name: z_entry
      kind: path
      path: long_entry.args[0].right.value
      values: [-1.5, -2.0, -2.5]
    - name: stop_mult
      kind: path
      path: exit.stop.mult
      values: [1.5, 2.0, 2.5]
strategy:
  dsl_version: "1"
  instrument: XAUUSD
  market: cfd
  timeframe: D1
  warmup_minutes: 288000
  session:
    start: "00:00"
    end: "23:59"
    flat_at: "23:59"
    or_minutes: 15
  long_entry:
    kind: and
    args:
      - kind: lt
        left: {kind: indicator, ind: zscore, n: 20}
        right: {kind: const, value: -2.0}
      - kind: gt
        left: {kind: price, price: close}
        right: {kind: indicator, ind: sma, n: 200}
      - kind: lt
        left: {kind: indicator, ind: rsi, n: 2}
        right: {kind: const, value: 10.0}
  short_entry: null
  exit:
    stop: {type: atr, mult: 2.0, n: 14}
    target: {type: rr, rr: 1.0}
    time_exit_minutes: 7200
    opposite_signal: false
  sizing:
    risk_per_trade_r: 1.0
  limits:
    max_trades_per_day: 1
    cooldown_minutes: 0
