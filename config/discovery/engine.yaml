# TradingLab 2.0 · Discovery Lab
# Límites del motor genético y reglas de calidad de datos.
# No activa nada: solo configura el proceso de descubrimiento.
engine:
  workers: 12
  ram_limit_gb: 8

discovery:
  # Un swap positivo es un crédito de financiación, no una ventaja de mercado.
  # En discovery solo se cuenta el swap como coste (negativo); el crédito real
  # se puede mostrar aparte en la capa de empresa/onboarding sin seleccionar.
  swap_credit: false
  # Copia automática de discovery.db tras register/approve/run/confirm/
  # record-informal. Retención: 30 últimas + primera de cada mes; lo retirado
  # se mueve a data/backups/_old/ (nunca se borra).
  backup: true
  # Spread del motor. En v1 manda p75_static (el comportamiento histórico).
  # En v2, si el símbolo tiene ASK, se usa historical_scaled; si no,
  # hourly_median. El p75 queda solo para los escenarios de estrés.
  spread_model: p75_static
  # Versión de coste de evaluaciones nuevas sin campaña guardada (edge map,
  # optimizador, onboarding). Las campañas guardadas conservan la suya.
  default_cost_model_version: 2

swap:
  # static = swap medido de swap.yaml (v1). historical = tipo de referencia
  # diario de FRED + markup calibrado para reproducir swap.yaml (v2).
  mode: historical

profiles:
  small:
    population: 40
    generations: 10
  medium:
    population: 100
    generations: 25
  large:
    population: 200
    generations: 60

genetics:
  mutation_rate: 0.3
  crossover_rate: 0.6
  elite_frac: 0.1

limits:
  max_nodes: 12
  max_depth: 4

validation:
  # Valores por defecto (compatibilidad). El motor usa SIEMPRE
  # by_timeframe[TF]; estos tres solo cubren campañas antiguas o tests.
  min_trades_is: 100
  min_trades_fold: 15
  folds: 4
  finalists_max: 5
  corr_cluster: 0.7
  # Congelados el 2026-11-21 ANTES de ejecutar campañas multi-TF. No se
  # cambian tras ver resultados. H4/D1 exigen fuente Dukascopy.
  by_timeframe:
    M1:  {min_trades_is: 200, min_trades_fold: 30, folds: 4}
    M5:  {min_trades_is: 100, min_trades_fold: 15, folds: 4}
    M15: {min_trades_is: 60,  min_trades_fold: 10, folds: 4}
    M30: {min_trades_is: 50,  min_trades_fold: 8,  folds: 4}
    H1:  {min_trades_is: 40,  min_trades_fold: 6,  folds: 4}
    H4:  {min_trades_is: 25,  min_trades_fold: 4,  folds: 3}
    D1:  {min_trades_is: 15,  min_trades_fold: 3,  folds: 3}

fitness:
  # Restricción dura: mediana de (coste ida y vuelta / distancia del stop) en R.
  cost_r_max: 0.10

# Slippage asumido (precio por lado) para el Discovery Lab. No está medido:
# se aplica a todas las cuentas sin slippage medido y los informes lo marcan
# como supuesto. US100 1,0 pt ≈ 0,5 bps. US500/US30: decisión del operador.
assumed_slippage:
  source: assumption
  instruments:
    US100: 1.0
    US500: 0.5
    US30: 2.5
    XAUUSD: 0.15
    EURUSD: 0.00005
    GBPUSD: 0.00005
    USDJPY: 0.005

robustness:
  random_trials: 1000
  pbo_min_strategies: 8
  min_trades_oos2: 30
  wf_min_oos_sharpe: 0.0
  wf_min_efficiency: 0.3
  wf_train_days: 60
  wf_test_days: 20
  pbo_slices: 16
  mc_paths: 5000
  bootstrap_paths: 5000
  challenge_paths: 5000
  challenge_accounts: [CFD-001, CFD-006]

perturb:
  # Pruebas de falsificación: no son hipótesis nuevas y no suman al DSR.
  noise_paths: 500
  noise_scale_atr: 0.10
  entry_delays: [1, 2]
  exit_delays: [1, 2]
  exec_paths: 1000
  exec_skip_frac: 0.05
  min_median_ratio: 0.5

data_quality:
  # Un hueco es un salto entre velas consecutivas > gap_factor × timeframe.
  gap_factor: 3
  # Huecos >= max_gap_hours son cierres de sesión/fin de semana/festivo: no cuentan.
  max_gap_hours: 4
  # Pausa programada: el mismo HH:MM LOCAL de reanudación en >= esta fracción
  # de días con datos. La pausa diaria del servidor se mide en pause_tz
  # (America/New_York para FTMO), no en la zona de trading del instrumento.
  scheduled_gap_share: 0.2
  # warn si hay más de warn_if_gaps_gt huecos no programados.
  warn_if_gaps_gt: 0
  # fail si los huecos no programados superan esta fracción de velas esperadas.
  fail_if_gap_pct_gt: 0.005

  # Pausa diaria del servidor (independiente de la lógica de trading).
  pause_tz: America/New_York

  # Zona de sesión por símbolo (case-insensitive); default America/New_York.
  session_tz:
    default: America/New_York
    US100.cash: America/New_York
    US500.cash: America/New_York
    US30.cash: America/New_York
    XAUUSD: America/New_York
    EURUSD: Europe/London
    GBPUSD: Europe/London
    USDJPY: Asia/Tokyo

  # Tramos por defecto. OOS-2 termina en la última vela disponible.
  default_segments:
    is: ["2021-10-01", "2024-06-30"]
    oos1: ["2024-07-01", "2025-06-30"]
    oos2: ["2025-07-01", null]

  # Fuente de datos por símbolo. `default` usa la caché MT5 estándar.
  # `calendar: nyse` activa festivos/cierres tempranos de EE. UU.; null significa
  # "sin calendario" (no se inventan festivos).
  sources:
    US100:
      path: data/cache/ea/US100_CASH_M5_NY.parquet
      timezone: America/New_York
      calendar: nyse
    US100.cash:
      path: data/cache/ea/US100_CASH_M5_NY.parquet
      timezone: America/New_York
      calendar: nyse
    US500.cash:
      path: data/cache/mt5/US500.CASH_M5.parquet
      timezone: UTC
      calendar: nyse
    US30:
      path: data/cache/discovery/US30_M5.parquet
      timezone: UTC
      calendar: nyse
    US30.cash:
      path: data/cache/discovery/US30_M5.parquet
      timezone: UTC
      calendar: nyse
    GER40:
      path: data/cache/discovery/GER40_M5.parquet
      timezone: UTC
      calendar: null
    GER40.cash:
      path: data/cache/discovery/GER40_M5.parquet
      timezone: UTC
      calendar: null
    XAUUSD:
      path: data/cache/discovery/XAUUSD_M5.parquet
      timezone: UTC
      calendar: null
    EURUSD:
      path: data/cache/discovery/EURUSD_M5.parquet
      timezone: UTC
      calendar: null
    GBPUSD:
      path: data/cache/discovery/GBPUSD_M5.parquet
      timezone: UTC
      calendar: null
    USDJPY:
      path: data/cache/discovery/USDJPY_M5.parquet
      timezone: UTC
      calendar: null
    default:
      path: data/cache/mt5/{symbol}_{tf}.parquet
      timezone: UTC
      calendar: null


