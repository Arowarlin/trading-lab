# Cuentas del fondo personal. La identidad vive aquí; los límites editables
# viven en SQLite (account_limit_history) para no entrar en ningún hash.
# Solo cuentas de fondeo CFD/futuros: no hay cuentas de acciones ni ETF.
accounts:
  ftmo_demo:
    name: "FTMO demo"
    type: fondeo
    broker: mt5
    platform: mt5
    firm: ftmo
    phase: challenge
    status: demo
    account_size: 100000
    account_daily_stop: 0.04
    pocket: intraday_fx
    symbol_risk_caps:
      US100.cash: 0.02
    account_risk_caps:
      symbol_pct: 0.02
      group_pct: 0.03
      total_pct: 0.04
      groups:
        indices_us: ["US100", "US500", "US30", "US2000"]
        metales: ["XAU", "XAG"]
        # `usd` se calcula en código: cualquier par que contenga USD.
    limits:
      daily_loss_pct: 0.05
      max_drawdown_pct: 0.10
      per_trade_risk_pct: 0.005
      max_open_risk_pct: 0.02
      max_trades_per_day: 4

  # Cuenta dedicada al EA externo cuando exista un FTMO Free Trial nuevo.
  # `blocked` hace que el laboratorio rechace abrir/operar esta cuenta.
  ftmo_trial_ea:
    name: "FTMO Free Trial EA (pendiente)"
    type: fondeo
    broker: mt5
    platform: mt5
    firm: ftmo
    phase: challenge
    status: blocked
    account_size: 100000
    account_daily_stop: 0.04
    pocket: intraday_fx
    symbol_risk_caps:
      US100.cash: 0.02
    account_risk_caps:
      symbol_pct: 0.02
      group_pct: 0.03
      total_pct: 0.04
      groups:
        indices_us: ["US100", "US500", "US30", "US2000"]
        metales: ["XAU", "XAG"]
        # `usd` se calcula en código: cualquier par que contenga USD.
    limits:
      daily_loss_pct: 0.05
      max_drawdown_pct: 0.10
      per_trade_risk_pct: 0.005
      max_open_risk_pct: 0.02
      max_trades_per_day: 4

  topstep_template:
    name: "Topstep 50K (plantilla inactiva)"
    type: fondeo
    broker: projectx
    platform: projectx
    firm: topstep
    phase: challenge
    status: template
    account_size: 50000
    pocket: intraday_futures
    limits:
      daily_loss_pct: 0.02
      max_drawdown_pct: 0.04
      per_trade_risk_pct: 0.0025
      max_open_risk_pct: 0.01
      max_trades_per_day: 3
