# Programa (esquema de docs/futures/04_SPEC_PROP_EV.md §8, ampliado en FUT-A10 el 2026-11-28).
# Origen: docs/futures/research/programs/lucid_flex_50k.yaml (borrador) y la ficha de la firma en
# docs/futures/research/propfirms_2026-11/. Las claves que antes llevaban "# EXT" ya son del esquema.
schema_version: 1
program_id: lucid_flex_50k
firm_id: lucid
rules_version: "2026-11-27.1"
consulted_at: 2026-11-27
expires_after_days: 30
instrument_unit: micro
phases:
  evaluation:
    start_balance: {value: 50000, status: verified}
    profit_target: {value: 3000, status: verified}
    max_loss: {mode: trailing_eod, amount: 2000, check: realtime_unrealized, lock_at: 50100, status: verified,
               note: "bloqueo en 50.100 al superar 52.100 de cierre; la fuente no aclara si cuenta el P&L no realizado (se toma el caso conservador)"}
    daily_loss: {action: pause_day, enabled: false, optional: true, status: sin_datos,
                 note: "DLL opcional elegida al comprar; importe no publicado para Flex. Con DLL Off no aplica"}
    consistency: {max_best_day_fraction: 0.40, basis: total_profit, on_violation: raise_target, status: verified,
                  note: "0,50 con el add-on de pago (importe Sin datos)"}
    min_trading_days: {value: 0, status: verified, note: "sin regla explícita; la consistencia del 40 % obliga a ≥ 3 días"}
    max_contracts: {mini: 4, micro: 40, status: verified}
    flat_by: {value: "16:45 America/New_York", status: verified, note: "la firma cierra la posición; no es rotura"}
  funded:
    start_balance: {value: 50000, status: verified}
    max_loss: {mode: trailing_eod, amount: 2000, check: realtime_unrealized, lock_at: 50100, lock_after_first_payout: true,
               status: verified, note: "el MLL se bloquea en 50.100 al pedir un payout aunque no se haya llegado a 52.100"}
    consistency: {status: verified, note: "ninguna en la financiada"}
    scaling_plan:
      status: verified
      basis: profit_eod
      tiers:
        - {min_profit: 0, mini: 2, micro: 20}
        - {min_profit: 1000, mini: 3, micro: 30}
        - {min_profit: 2000, mini: 4, micro: 40}
      note: "se actualiza al final de cada sesión; un payout puede bajar el escalón; superarlo puede anular el beneficio del día"
    max_accounts: {status: sin_datos}
    inactivity_close_days: {status: sin_datos}
    payout:
      eligibility: {template: winning_days, n: 5, min_day_profit: 150, net_positive_cycle: true, status: verified}
      max_fraction_of_balance: {value: 0.5, status: discrepancia,
                                note: "la tabla dice 50 % del beneficio y el texto 50 % del balance; se toma beneficio"}
      fraction_basis: profit
      cap_per_payout: {value: 2000, status: verified, note: "no sube con más payouts"}
      buffer_min: {value: 0, status: verified}
      min_amount: {value: 500, status: verified}
      split: {value: 0.90, status: verified}
      processing_days: {value: 2, status: verified, note: "días hábiles"}
      max_payouts: {value: 5, status: verified, then: to_live}
fees:
  evaluation: {type: one_time, status: sin_datos, note: "DLL On + 40 % es la versión más barata; DLL Off + 50 %, la más cara"}
  consistency_addon: {status: sin_datos}
  activation: {amount: 0, status: verified}
  reset: {status: sin_datos}
  data_platform_monthly: {status: sin_datos}
commissions_per_side: {MNQ: {value: 0.50, status: verified}, NQ: {value: 1.75, status: verified}}
compliance:
  news: {allowed: true, status: verified}
  overnight: {allowed: false, status: verified}
  automation: {category: allowed, status: verified, source_doc: config/prop_economics/firms_futures.yaml}
sources:
  - {url: "https://support.lucidtrading.com/en/articles/12945790-lucidflex-evaluation-account", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/12945795-lucidflex-funded-account", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/12945796-lucidflex-payouts", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/12945808-lucidflex-scaling-plan", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/12945815-lucidflex-drawdown", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/16226050-lucidflex-customization", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/11508978-approved-products-and-commissions", consulted_at: 2026-11-27}
  - {url: "https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times", consulted_at: 2026-11-27}
