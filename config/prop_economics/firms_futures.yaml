        - "Prohibidos VPS, VPN y servidores remotos: la actividad debe salir del equipo propio."
        - "NinjaTrader 8 no está disponible: TopstepX es la única plataforma (ficha topstep.md)."
      quote: "Live funded accounts are not allowed to trade through the ProjectX API."
      source: {url: "https://help.topstep.com/en/articles/11187768-topstepx-api-access", consulted_at: 2026-11-27}

