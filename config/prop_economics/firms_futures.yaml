# Catálogo de firmas de fondeo de FUTUROS · clasificación por automatización (bots)
#
# Fuente de verdad del motor EV (docs/futures/04_SPEC_PROP_EV.md) para la política de bots.
# No sustituye a config/propfund/firms.yaml (Prop Fund, producción): la sincronización es la tarea
# FUT-A10 de docs/futures/05_COLA_Y_ROADMAP.md.
#
# Categorías de automation.category:
#   allowed      Permite bots (con los límites generales: sin HFT, sin explotar fills simulados).
#   conditional  Permite bots propios con condiciones (propiedad, plataforma, API, tipo de cuenta).
#   prohibited   No permite bots; como mucho, señales semiautomáticas con ejecución manual.
#   unverified   No verificado en fuente oficial en la fecha indicada (no se usa para decidir).
#
# status: verified (leído en la página oficial citada en consulted_at) · unverified · sin_datos.
# Regla: una firma unverified NUNCA se trata como si permitiera bots.

version: 1
consulted_at: 2026-11-27
expires_after_days: 30

firms:
  - id: topstep
    name: Topstep
    website: https://www.topstep.com
    automation:
      category: conditional
      status: verified
      conditions:
        - "Solo a través de la API TopstepX (ProjectX), suscripción aparte: 29 USD/mes (14,50 con el código de Topstep)."
