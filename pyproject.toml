[project]
name = "tradinglab"
version = "0.1.0"
description = "Entorno multi-bot de trading: datos, backtest, riesgo, ejecución y agentes LLM"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lab = "tradinglab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradinglab"]

[tool.ruff]
line-length = 110
target-version = "py312"
