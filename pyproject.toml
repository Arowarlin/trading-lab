[project]
name = "tradinglab"
version = "0.1.0"
description = "Entorno multi-bot de trading: datos, backtest, riesgo, ejecución y agentes LLM"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "yfinance==1.8.0",
    "typer==0.27.3",
    "rich==15.0.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "pyarrow==26.0.1",
    "httpx==0.28.1",
    "alpaca-py==0.45.0",
    "keyring==25.7.0",
    "optuna==5.0.0",
    "quantstats==0.0.86",
    "arch==9.0.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5==5.0.6231", "tzdata==2026.6"]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pre-commit==4.7.0"]
discovery = ["numba>=0.60"]

[project.scripts]
lab = "tradinglab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradinglab"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# Lint base del proyecto: errores reales + imports. Evita ruido de reglas
# opinables (BLE/S/PLW) que el código usa a propósito en fronteras externas.
select = ["E4", "E7", "E9", "F", "I", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv*", "data", "reports", "logs", "legacy"]
markers = [
    "network: usa red real o loopback; se salta en CI",
    "mt5: requiere MetaTrader5 o un terminal MT5",
    "lmstudio: requiere LM Studio local",
    "alpaca: requiere credenciales o red de Alpaca",
    "credentials: requiere Windows Credential Manager real",
    "slow: prueba lenta (ruido sintético); corre en pytest -q",
]
