# H-2026-013b · intradía H1 US100 con filtro D1 Close > SMA50 (Dukascopy).
# Prerregistro corregido tras la verificación F3 (hash 9605ebc8…, veredicto
# Defectos). Solo cambia la documentación (15:00 / 360) y la plantilla pasa a
# `_v2` con `flat_mode: no_overnight`; la hipótesis no se ha evaluado y no se
# añade una fecha de inicio nueva.
#
# Hipótesis: en un régimen alcista diario (cierre D1 por encima de su SMA50),
# la sesión de Nueva York tiende a continuar al alza. La posición es intradía:
# se cierra a las 15:00 NY (o en la última vela disponible si NYSE cierra antes),
# así que nights == 0 y no hay swap. El filtro D1 no añade parámetros libres;
# la entrada es una hora fija (09:00 NY) y la salida es por tiempo/stops fijos.
#
# Cobertura: solo 2019-01-02 en adelante. D3 mostró 0 sesiones válidas en
# 2012/2016/2017 y 72,1 % de noches en 2018; el detalle está en
# reports/tl3/saneamiento-f1.md.

