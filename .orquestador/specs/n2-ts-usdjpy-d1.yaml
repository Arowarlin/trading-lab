# N2 · momentum de serie temporal en D1 (USDJPY).
# Hipótesis: el carry y el flujo de tendencia del yen frente al dólar persisten
# en D1; el cruce lento separa regímenes y el trailing evita cortar la cola.
# Se excluye US100 para no duplicar la incubación us100-trend-d1.
campaign_id: n2-ts-usdjpy-d1
instrument: USDJPY
timeframe: D1
template: ts_momentum_d1
profile: small
mode: grid
seed: 32
data_source: dukascopy
account: CFD-001
firm: ftmo
cost_mode: best
cost_accounts: [CFD-001, CFD-006]
segments:
  is: ["2004-01-01", "2024-06-30"]
  oos1: ["2024-07-01", "2025-06-30"]
  oos2: ["2025-07-01", null]
grid:
  dimensions:
    - name: fast_n
      kind: path
      path: long_entry.left.n
      values: [20, 50, 100]
    - name: slow_n
      kind: path
      path: long_entry.right.n
      values: [150, 200, 250]
    - name: stop_mult
      kind: path
      path: exit.stop.mult
      values: [2.5, 3.0, 3.5]
