# R9 — espejo de CONFIRMACIÓN turn_of_month en US100 D1 (Databento NQ).
# SOLO CONFIRMACIÓN: no registrar sin decisión explícita del operador.
# Hipótesis (literal, escrita antes de calcular nada):
# "Los índices de EE. UU. concentran una parte desproporcionada de su
#  rentabilidad entre el último día hábil del mes y los primeros días hábiles
