# N2 · reversión tras extensión en D1 (EURUSD).
# Hipótesis: en un EURUSD por encima de SMA(200), las caídas extremas de corto
# plazo (z < -2 y RSI(2) < 10) rebotan hacia la media; el stop ATR y el target
# 1R convierten el rebote en una operación de días, no de horas.
campaign_id: n2-d1reversion-eurusd
instrument: EURUSD
timeframe: D1
template: d1_extension_reversion
profile: small
mode: grid
seed: 52
data_source: dukascopy
account: CFD-001
firm: ftmo
cost_mode: best
cost_accounts: [CFD-001, CFD-006]
segments:
  is: ["2004-01-01", "2024-06-30"]
  oos1: ["2024-07-01", "2025-06-30"]
  oos2: ["2025-07-01", null]
grid:
  dimensions:
    - name: z_n
      kind: path
      path: long_entry.args[0].left.n
      values: [10, 20, 30]
    - name: z_entry
      kind: path
      path: long_entry.args[0].right.value
      values: [-1.5, -2.0, -2.5]
    - name: stop_mult
      kind: path
      path: exit.stop.mult
      values: [1.5, 2.0, 2.5]
